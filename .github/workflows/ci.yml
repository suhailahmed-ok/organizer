name: CI

on:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: build docker image
        run: docker build -t my-organizer-app .

      - name: Run docker container
        run: docker run --rm my-organizer-app  

 



        


        
      
     
