name: CI

on:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: build docker image
        run: docker build -t my-organizer-app .

      - name: Run docker container
        run: docker run --rm my-organizer-app 


      - name: check docker hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "DOCKERHUB USERNAME IS AVAILABLE"
          echo "DOCKERHUB TOKEN IS AVAILABLE"

          
        

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag docker image
        run: docker tag my-organizer-app:latest sohail4hmed/organizer:latest

      - name: push docker image
        run: docker push sohail4hmed/organizer:latest   

            
             

 



        


        
      
     
